name: Dart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: dart format
        run: dart format -o none --set-exit-if-changed .
      - name: dart analyze
        run: dart analyze --fatal-infos --fatal-warnings .
      - name: dependency_validator
        run: dart run dependency_validator
      - name: dart doc
        run: dart doc --dry-run
      - name: dart pub publish --dry-run
        run: dart pub publish --dry-run

  test_vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Dart version
        run: |
          dart --version
          uname -a
      - name: Install dependencies
        run: dart pub get
      - name: Run tests (VM)
        run: dart test --platform vm --coverage=./coverage
      - name: Generate coverage report
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -o ./coverage/lcov.info -i ./coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          directory: ./coverage/
          flags: unittests
          env_vars: OS,DART
          fail_ci_if_error: false
          verbose: true

  # The library is pure Dart: the same tests run on the web, compiled by
  # dart2js and by dart2wasm. The golden test pins the output bytes, so a
  # platform difference in any strategy fails here.
  test_web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      # ubuntu-latest ships Google Chrome, which `dart test` finds.
      - name: Install dependencies
        run: dart pub get
      - name: Run tests (Chrome, dart2js)
        run: dart test --platform chrome
      - name: Run tests (Chrome, dart2wasm)
        run: dart test --platform chrome --compiler dart2wasm

  # File paths, line endings and the CLI differ per OS: run the integration,
  # CLI and golden tests on macOS and Windows too. The full suite runs on
  # Linux above.
  test_os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - name: Install dependencies
        run: dart pub get
      - name: Run integration, CLI and golden tests
        run: dart test -t "integration || cli || golden"
